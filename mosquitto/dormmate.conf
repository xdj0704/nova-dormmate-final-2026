# DormMate 本机 Mosquitto 配置（Mosquitto 2.x）
#
# 启动：
#   mosquitto -c mosquitto/dormmate.conf -v
#
# 要点：2.x 默认只监听 localhost 且禁止匿名，必须显式写出 listener 和
# allow_anonymous，否则 MQTTX（1883）或浏览器（9001）都连不上。

# 1) MQTT / TCP —— MQTTX 与 Python 发布端走这里
#    绑 0.0.0.0 是为了 M5 多节点时局域网内其他机器也能发布；
#    只想本机用就改成 127.0.0.1。
listener 1883 0.0.0.0
protocol mqtt

# 2) WebSocket —— 浏览器走这里。绑 0.0.0.0 是为了手机/别的电脑也能看看板：
#    页面会按访问用的主机名自己拼 ws://<那台机器访问时用的地址>:9001，
#    所以不用为换设备改代码。只想本机用就改回 127.0.0.1。
listener 9001 0.0.0.0
protocol websockets

# 课程演示环境：允许匿名连接。切勿照搬到公网。
allow_anonymous true

# 日志
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# 不落盘，进程重启即清空
persistence false
