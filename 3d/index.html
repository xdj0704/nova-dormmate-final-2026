<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DormMate 3D · Step 6-2 简化宿舍</title>
<style>
  html, body { height: 100%; }

  body {
    margin: 0;
    background: #f9f9f7;
    color: #0b0b0b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  header { padding: 22px 24px 14px; }

  h1 { margin: 0; font-size: 20px; font-weight: 650; }

  .sub {
    margin: 5px 0 0;
    font-size: 13px;
    color: #898781;
  }

  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    padding: 1px 5px;
    background: #fcfcfb;
    border: 1px solid #e1e0d9;
    border-radius: 5px;
  }

  /* 3D 容器。三条不能省的：
     - 必须有确定的高度。高度是 0 的话 clientHeight 就是 0，相机算不出宽高比。
       这里给的是 60vh（视口高度的六成），加 min-height 兜住矮窗口。
     - overflow: hidden。three 的 setSize 设的是 canvas 的 CSS 尺寸，
       和容器差一个像素时就会顶出滚动条，整个页面跟着抖。
     - position: relative。setLabel 那层覆盖层是绝对定位的，得有个定位祖先；
       少了它，覆盖层会跑到 <body> 上去，飘到页面左上角。 */
  #scene {
    position: relative;
    overflow: hidden;
    margin: 0 24px 12px;
    height: 60vh;
    min-height: 320px;
    border: 1px solid #e1e0d9;
    border-radius: 14px;
    background: #ececea;   /* 画布还没铺满时先兜个底，避免闪一下白 */
  }

  /* setLabel 写字的覆盖层。由 scene.js 建出来挂进 #scene，这里只负责样式：
     - absolute + 左上角：盖在画布上面
     - pointer-events: none：**关键**。不写的话这层会吃鼠标事件，
       将来想给 3D 加拖拽/点击就点不穿，而且现在它盖住的那块也没法选中。
     - 底色半透明：字压在深色模型上也要看得清 */
  .scene-label {
    position: absolute;
    top: 14px;
    left: 14px;
    pointer-events: none;
    padding: 7px 12px;
    font-size: 13px;
    line-height: 1.5;
    color: #0b0b0b;
    background: rgba(252, 252, 251, 0.86);
    border: 1px solid #e1e0d9;
    border-radius: 8px;
    backdrop-filter: blur(3px);
  }

  /* WebGL 起不来时由 scene.js 写进来（见那边的 try/catch） */
  .scene-error {
    margin: 0;
    padding: 24px;
    font-size: 14px;
    line-height: 1.8;
    color: #d03b3b;
  }

  /* ---- 测试按钮 ---- */

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin: 0 24px 24px;
  }

  .controls .hint {
    font-size: 13px;
    color: #898781;
    margin-right: 4px;
  }

  .controls button {
    font: inherit;
    font-size: 14px;
    padding: 7px 16px;
    color: #0b0b0b;
    background: #fcfcfb;
    border: 1px solid #e1e0d9;
    border-radius: 8px;
    cursor: pointer;
  }

  .controls button:hover { background: #f2f1ec; }

  .controls button:focus-visible {
    outline: 2px solid #2a78d6;
    outline-offset: 2px;
  }

  /* 当前选中的那个：加粗 + 蓝边。不靠颜色单独表意，按钮上本来就有文字。 */
  .controls button.is-active {
    font-weight: 650;
    border-color: #2a78d6;
    box-shadow: inset 0 0 0 1px #2a78d6;
  }
</style>
</head>
<body>

  <header>
    <h1>DormMate 3D</h1>
    <p class="sub">Step 6-2：简化宿舍 —— 地板 / 墙 / 床 / 窗户 / 风扇，点按钮看四种状态</p>
  </header>

  <!-- index.html 只管三件事：把容器摆好、调 createDorm3D、把按钮接上。
       宿舍长什么样、每种状态改什么，全在 scene.js 里，这个文件一概不管。 -->
  <div id="scene"></div>

  <div class="controls">
    <span class="hint">试一下：</span>
    <!-- data-status 里写的必须是统一规则那四个字，一个字都不能差 ——
         差一个字 updateScene 就认不出来，只能退回「正常」并在控制台警告。 -->
    <button type="button" data-status="正常">正常</button>
    <button type="button" data-status="偏冷">偏冷</button>
    <button type="button" data-status="偏热">偏热</button>
    <button type="button" data-status="偏湿">偏湿</button>
  </div>

  <!-- three.js 0.160.0：先用 CDN。

       importmap 的内容必须是**合法 JSON**，所以里面一行注释都不能写
       （JSON 没有注释语法），说明只能放在外面。

       这个文件（0.160.0 的 build/three.module.js）是自包含的，内部不再 import
       任何东西，所以整张映射表只有 "three" 这一条。换成别的版本时要留意：
       新版本把核心拆去了 three.core.js，只映射 "three" 会报找不到模块。

       ── 改成完全本地（现场没网时）──
       把下面那行的 URL 换成：

           "three": "./lib/three.module.js"

       文件已经躺在 3d/lib/ 里了，其余一个字都不用动。
       路径是相对**页面所在目录**的，所以是 './lib/…' 而不是 './3d/lib/…'。

       importmap 里只有以 './' 或 '../' 开头的写法会被当成相对 URL 解析；
       'three' 这种裸名字浏览器不知道去哪儿找，必须靠这张表映射 ——
       这正是 importmap 存在的意义：让源码里能写 import ... from 'three'，
       而不必把 CDN 的长 URL 抄进每个模块。 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js"
    }
  }
  </script>

  <!-- 必须是 type="module"，否则 import 语句直接报语法错。
       也正因为是模块，这段脚本和 scene.js 都走 CORS —— 所以页面不能再用
       file:// 直接打开（file:// 下模块会被当成跨域拒绝），必须走 http 服务器：

           http://localhost:8000/3d/
  -->
  <script type="module">
    import { createDorm3D } from './scene.js';

    // M5 起是多节点，所以这里写明是哪个宿舍；M1~M4 只有一个宿舍时不写也行。
    const NODE_ID = 'dorm-a';

    const dorm = createDorm3D('scene');

    const buttons = Array.prototype.slice.call(
      document.querySelectorAll('.controls button')
    );

    /**
     * 应用一个状态：改场景 + 改覆盖层文字 + 标出当前按钮。
     * 这三件事分属三个对象（scene / label / DOM），所以放在页面这边组合，
     * scene.js 里的 updateScene 只管场景那部分。
     */
    function apply(status) {
      const applied = dorm.updateScene(status);
      dorm.setLabel('当前宿舍：' + NODE_ID + '｜状态：' + applied);

      buttons.forEach(function (btn) {
        btn.classList.toggle('is-active', btn.dataset.status === applied);
      });
    }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        apply(btn.dataset.status);
      });
    });

    // 页面一打开就摆成「正常」，并且让「正常」那个按钮是高亮的 ——
    // 否则初始状态和按钮高亮对不上，看的人会以为是坏的。
    apply('正常');
  </script>

</body>
</html>
