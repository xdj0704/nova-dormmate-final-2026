<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DormMate 多节点 Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>DormMate 多节点 Dashboard</h1>
      <p class="sub">dorm-a · dorm-b · dorm-c 三节点对比 · 订阅 <code>dormmate/+/env</code></p>
    </div>
    <div class="top-actions">
      <span id="conn" class="conn conn--pending">
        <span class="conn-dot"></span><span id="conn-text">未连接</span>
      </span>
      <button id="toggle" class="ghost" type="button">连接</button>
      <button id="simulate" class="primary" type="button">模拟三节点数据</button>
      <button id="clear" class="ghost" type="button">清空</button>
    </div>
  </header>

  <section id="cards" class="cards"></section>

  <section class="panel">
    <div class="panel-head">
      <h2>趋势 · <span id="detail-node">—</span></h2>
      <span id="detail-meta" class="note"></span>
    </div>

    <p id="chart-note" class="note chart-note"></p>

    <!-- 温湿度分成两张图，不用双 Y 轴：两者的单位和量级都不同，
         叠在一张图上要么把温度压成一条直线，要么让两条线的交叉点
         变成毫无意义的视觉暗示。两张图共用同一组时间刻度，趋势照样能横向比。 -->
    <div class="charts">
      <figure class="chart-box">
        <figcaption>温度 ℃</figcaption>
        <div class="chart-canvas"><canvas id="chart-temp"></canvas></div>
      </figure>
      <figure class="chart-box">
        <figcaption>湿度 %</figcaption>
        <div class="chart-canvas"><canvas id="chart-humidity"></canvas></div>
      </figure>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>消息日志 <span id="log-count" class="count"></span></h2>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>级别</th>
            <th>Topic</th>
            <th>内容</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
  </section>

  <footer class="foot">
    状态判定规则（按顺序，命中即停）：<code>&lt;18</code> 偏冷 →
    <code>≥30</code> 偏热 → <code>湿度 ≥75</code> 偏湿 → 正常。
    收到报文里的 <code>status</code> 只作参考，一律用规则复核，不一致时以规则为准。
  </footer>

</div>

<!-- 三个库的顺序不能换：mqtt 和 rules 都要在 dashboard.js 之前加载完，
     dashboard.js 打开页面就会调 connect() 和 judgeStatus()。 -->

<!-- mqtt.js 5.10.1：用本地的，不走 CDN。
     和下面的 Chart.js 不一样，这个是故意的 —— mqtt.js 加载不上就没有数据，
     整个看板是空的；Chart.js 加载不上只是少了趋势图，卡片和日志照常用。
     风险不一样大，所以对待方式也不一样。文件已经是现成的，不必再下一次。
     真要改成 CDN，把下面这行换成：
       <script src="https://registry.npmmirror.com/mqtt/5.10.1/files/dist/mqtt.min.js"></script>
     源用 npmmirror（阿里维护的 npm 镜像），别用 jsDelivr —— 实测本机连不上。 -->
<script src="lib/mqtt.min.js"></script>

<!-- Chart.js 4.5.1：先用 CDN。
     源特意选了 npmmirror 而不是 jsDelivr —— 实测本机连 jsDelivr 是 0.2 秒就失败的
     连不上，npmmirror/unpkg/BootCDN/staticfile 都通。
     现场没网就把下面这行换成 <script src="lib/chart.umd.min.js"></script>，
     那个文件已经在 dashboard/lib/ 里放好了，其余不用动。
     （把这一行也换成 lib/ 之后，整个页面就完全不依赖外网了。） -->
<script src="https://registry.npmmirror.com/chart.js/4.5.1/files/dist/chart.umd.min.js"></script>

<script src="../shared/rules.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
