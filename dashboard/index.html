<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DormMate 多节点 Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>DormMate 多节点 Dashboard</h1>
      <p class="sub">dorm-a · dorm-b · dorm-c 三节点对比 · 订阅 <code>dormmate/+/env</code></p>
    </div>
    <div class="top-actions">
      <span id="conn" class="conn conn--pending">
        <span class="conn-dot"></span><span id="conn-text">未连接</span>
      </span>
      <button id="toggle" class="ghost" type="button">连接</button>
      <button id="simulate" class="primary" type="button">模拟三节点数据</button>
      <button id="clear" class="ghost" type="button">清空</button>
    </div>
  </header>

  <!-- 优先关注。整个栏的内容由 dashboard.js 的 renderPriority() 填进来，
       这里只留一个空容器。

       为什么不用 aria-live：这一栏每收到一条报文都要重画（时长和次数都在变），
       现场演示时几秒一条，读屏软件会跟着念个不停，反而把真正要看的东西盖住。
       它是个可以随时主动 Tab 过去看的地方，不是「必须立刻播报」的警报。 -->
  <section id="priority" class="priority" aria-label="优先关注"></section>

  <!-- 当前总览 + 判断依据（Step 8-1）。这两句都由 dashboard.js 的 renderInsight()
       现算现贴，容器里一开始什么都不放。

       B1 说整体（几个正常、几个需要关注、谁是当前重点），B2 说为什么是它、
       别人为什么不是。两块放在同一个面板里，是因为它们是连着读的：
       先看「现在什么样」，再看「凭什么这么判断」。

       两句话里没有一个字是写死的 —— 节点名、数字、状态、时长全从当前数据
       算出来，所以换成四个宿舍、或者节点名不叫 dorm-x，这里说的还是实话。

       为什么用 <p> 而不是 aria-live：和上面那条优先关注栏同理，每收到一条
       报文这两句都会重画（时长和计数一直在变），加 aria-live 的话读屏软件
       会跟着念个不停，反而把真正要看的东西盖住。 -->
  <section class="panel">
    <div class="panel-head">
      <h2>当前总览</h2>
    </div>
    <p id="overview" class="insight"></p>

    <div class="panel-head panel-head--sub">
      <h2>判断依据</h2>
    </div>
    <p id="reasons" class="insight"></p>
  </section>

  <section id="cards" class="cards"></section>

  <section class="panel">
    <div class="panel-head">
      <h2>趋势 · <span id="detail-node">—</span></h2>
      <span id="detail-meta" class="note"></span>
    </div>

    <!-- 处理动作。作用在**当前正在看的那个节点**上，所以它跟着 #detail-node 走。
         按钮的禁用状态和旁边那行字都由 dashboard.js 的 renderAction() 填：
         没有数据、或者状态已经正常时按不动（没有要处理的事）。 -->
    <div class="action-bar">
      <button id="action-fan" class="primary" type="button">开启风扇 / 通风</button>
      <span id="action-state" class="action-state"></span>
    </div>

    <p id="chart-note" class="note chart-note"></p>

    <!-- 3D 视图。跟着当前选中的节点走：点卡片切节点、或当前这个节点收到
         新消息时，dashboard.js 会调 updateScene + setLabel。
         容器的高度写在 style.css 里，必须是确定值 ——
         读不到 clientHeight 的话相机就算不出宽高比。 -->
    <figure class="scene-box">
      <figcaption>宿舍实景（跟着当前选中的节点走）</figcaption>
      <div id="scene3d"></div>
    </figure>

    <!-- 温湿度分成两张图，不用双 Y 轴：两者的单位和量级都不同，
         叠在一张图上要么把温度压成一条直线，要么让两条线的交叉点
         变成毫无意义的视觉暗示。两张图共用同一组时间刻度，趋势照样能横向比。 -->
    <div class="charts">
      <figure class="chart-box">
        <figcaption>温度 ℃</figcaption>
        <div class="chart-canvas"><canvas id="chart-temp"></canvas></div>
      </figure>
      <figure class="chart-box">
        <figcaption>湿度 %</figcaption>
        <div class="chart-canvas"><canvas id="chart-humidity"></canvas></div>
      </figure>
    </div>
  </section>

  <!-- 事件记录（Step 7-4）。和下面「消息日志」的区别是粒度：
       那边一条报文一行，这边一段连续异常一行。节点从正常变成异常时开一条，
       恢复正常时结案；中途状态从偏热变成偏湿**不会**另开一条，
       和「优先关注」那边「统计的是连续异常、不是连续偏热」是同一个口径。

       整张表由 dashboard.js 的 renderEvents() 填，导出按钮的点击也在那边挂
       （exportEventsCSV）。一条事件都没有时按钮是禁用的 —— 不然点了会得到
       一个只有表头的空 CSV，拿到的人会以为导出坏了。
       表格列的顺序就是导出 CSV 的列顺序，改的时候两边一起改。 -->
  <section class="panel">
    <div class="panel-head">
      <h2>事件记录 <span id="event-count" class="count"></span></h2>
      <button id="export-events" class="ghost" type="button" disabled>导出事件 CSV</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>开始</th>
            <th>节点</th>
            <th>问题</th>
            <th>优先关注</th>
            <th>处理动作</th>
            <th>恢复</th>
            <th>结果</th>
          </tr>
        </thead>
        <tbody id="event-body"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>消息日志 <span id="log-count" class="count"></span></h2>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>级别</th>
            <th>Topic</th>
            <th>内容</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
  </section>

  <footer class="foot">
    状态判定规则（按顺序，命中即停）：<code>&lt;18</code> 偏冷 →
    <code>≥30</code> 偏热 → <code>湿度 ≥75</code> 偏湿 → 正常。
    收到报文里的 <code>status</code> 只作参考，一律用规则复核，不一致时以规则为准。
  </footer>

</div>

<!-- 三个库的顺序不能换：mqtt 和 rules 都要在 dashboard.js 之前加载完，
     dashboard.js 打开页面就会调 connect() 和 judgeStatus()。
     Step 6-3 起它们还必须是**普通 script** —— dashboard.js 已经是 ES 模块了，
     但 mqtt / Chart / judgeStatus 这三个仍然走全局变量：
     mqtt.min.js 和 chart.umd.min.js 是 UMD 包，本来就没有 export；
     shared/rules.js 同理（一个 IIFE，往 globalThis 上挂函数）。
     在模块里 import 它们是 import 一个没有 export 的文件，拿到的是 undefined。 -->

<!-- mqtt.js 5.10.1：用本地的，不走 CDN。
     和下面的 Chart.js 不一样，这个是故意的 —— mqtt.js 加载不上就没有数据，
     整个看板是空的；Chart.js 加载不上只是少了趋势图，卡片和日志照常用。
     风险不一样大，所以对待方式也不一样。文件已经是现成的，不必再下一次。
     真要改成 CDN，把下面这行换成：
       <script src="https://registry.npmmirror.com/mqtt/5.10.1/files/dist/mqtt.min.js"></script>
     源用 npmmirror（阿里维护的 npm 镜像），别用 jsDelivr —— 实测本机连不上。 -->
<script src="lib/mqtt.min.js"></script>

<!-- Chart.js 4.5.1：先用 CDN。
     源特意选了 npmmirror 而不是 jsDelivr —— 实测本机连 jsDelivr 是 0.2 秒就失败的
     连不上，npmmirror/unpkg/BootCDN/staticfile 都通。
     现场没网就把下面这行换成 <script src="lib/chart.umd.min.js"></script>，
     那个文件已经在 dashboard/lib/ 里放好了，其余不用动。
     （把这一行也换成 lib/ 之后，整个页面就完全不依赖外网了。） -->
<script src="https://registry.npmmirror.com/chart.js/4.5.1/files/dist/chart.umd.min.js"></script>

<script src="../shared/rules.js"></script>

<!-- three.js 0.160.0 的 importmap，和 3d/index.html 里那张是同一张。

     为什么 dashboard 也要有一份：importmap 是**文档级**的，认的是「哪个页面」，
     不是「哪个模块」。dashboard.js import 了 ../3d/scene.js，而 scene.js 里写着
     import ... from 'three' —— 那个裸名字最终是在**这个页面**的映射表里查的。
     少了这张表，报错是「Failed to resolve module specifier "three"」，
     而且是在 scene.js 里报，看着像是 3d/ 那边坏了。

     映射的是裸名字，所以和页面所在目录没关系：dashboard/ 和 3d/ 共用同一张表，
     一个字都不用改。

     importmap 的内容必须是合法 JSON，所以里面一行注释都写不了。

     ── 改成完全本地（现场没网时）──
     把下面那行换成 "three": "../3d/lib/three.module.js"，
     文件已经在 3d/lib/ 里放好了，其余不用动。
     这里必须写 '../3d/lib/…'，不能写 './lib/…' —— 相对路径是相对
     **这个页面所在的 dashboard/** 算的，而本地那份 three 放在 3d/ 里。 -->
<script type="importmap">
{
  "imports": {
    "three": "https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js"
  }
}
</script>

<!-- dashboard.js 是 type="module"（Step 6-3 起），而且是上面这张表之后的第一条
     模块脚本 —— importmap 必须排在它前面，排在后面浏览器不认。

     换成模块的代价和 3d/ 那个页面一样：模块走 CORS，file:// 直接打开会被拒，
     必须走 http 服务器：
         http://localhost:8000/dashboard/
     好处是模块默认 defer，脚本执行时 DOM 一定已经就绪，不必再依赖
     「<script> 写在 </body> 前面」这件事。 -->
<script type="module" src="dashboard.js"></script>
</body>
</html>
