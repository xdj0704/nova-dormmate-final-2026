<?xml version="1.0" encoding="UTF-8"?>
<!--
  DormMate Final · PPT 第 7 页配图：D3 事件状态机
  四个状态、四条转移，红线单独用一块横幅压在顶上。
  颜色同样取自 dashboard/style.css 的 token：
  已恢复用 status-good，#0ca30c；未恢复用 status-serious，#ec835a；红线用 status-critical，#d03b3b。
  底下三行说明文字用的是各自的深色版本（#0a7a0a / #b04a12），在浅底上都过 4.5:1。
  「后面连着 N 条正常」这句话是这张图的重点 —— 判恢复的是数据，不是那次点击。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800"
     role="img" aria-label="DormMate 事件状态机：OPEN 到 HANDLING，再由后续数据判定 RECOVERED 或 UNRESOLVED">

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                           "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t    { fill: #0b0b0b; }
      .t2   { fill: #52514e; }
      .t3   { fill: #898781; }
      .good { fill: #0a7a0a; }
      .sero { fill: #b04a12; }
      .red  { fill: #d03b3b; }
      .ln     { stroke: #52514e; stroke-width: 2.2; fill: none; }
      .ln-red { stroke: #d03b3b; stroke-width: 2.2; fill: none; }
    </style>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d03b3b"/>
    </marker>
  </defs>

  <rect width="1440" height="800" fill="#f9f9f7"/>

  <!-- ============================ 标题 ============================ -->
  <text class="sans t" x="32" y="46" font-size="29" font-weight="700">
    一个事件的一辈子：开案 → 处理 → 到底好没好
  </text>
  <text class="sans t2" x="32" y="76" font-size="15">
    OPEN → HANDLING → RECOVERED / UNRESOLVED　·　四个状态全在 events.py，core 只负责叫它
  </text>

  <!-- =========================== 红线横幅 =========================== -->
  <rect x="32" y="100" width="1376" height="64" rx="10"
        fill="#fdf0f0" stroke="#d03b3b" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="sans red" x="720" y="129" font-size="16" font-weight="700" text-anchor="middle">
    红线：按一下「开始处理」，不能让事件变成「已恢复」
  </text>
  <text class="sans t" x="720" y="152" font-size="13" text-anchor="middle">
    恢复只能由后来收到的数据判出来 —— 处理指令只把事件推到「处理中」，推到那儿它就不动了
  </text>

  <!-- ============================ 图区 ============================ -->
  <rect x="32" y="196" width="1376" height="460" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>

  <!-- 入口 -->
  <path class="ln" d="M 56 410 L 134 410" marker-end="url(#a-ink)"/>
  <text class="sans t2" x="56" y="388" font-size="11.5">异常读数来了</text>
  <text class="sans t3" x="56" y="435" font-size="11">core 自动开案</text>

  <!-- OPEN 自环 -->
  <path class="ln" d="M 210 350 C 210 294, 300 294, 318 350" marker-end="url(#a-ink)"/>
  <text class="sans t3" x="266" y="272" font-size="11" text-anchor="middle">这一段已经开着</text>
  <text class="sans t3" x="266" y="288" font-size="11" text-anchor="middle">段里再来异常不另开案</text>

  <!-- OPEN -->
  <rect x="140" y="350" width="230" height="120" rx="12" fill="#f7fafe" stroke="#2a78d6" stroke-width="2"/>
  <text class="mono t" x="255" y="384" font-size="19" font-weight="700" text-anchor="middle">OPEN</text>
  <text class="sans t2" x="255" y="408" font-size="14" text-anchor="middle">待处理</text>
  <line x1="158" y1="421" x2="352" y2="421" stroke="#cfe0f5" stroke-width="1"/>
  <text class="sans t3" x="255" y="443" font-size="10.5" text-anchor="middle">节点第一次异常时自动开一条</text>
  <text class="sans t3" x="255" y="459" font-size="10.5" text-anchor="middle">start_time 取的是报文里的 time</text>

  <!-- OPEN → HANDLING -->
  <path class="ln" d="M 370 410 L 651 410" marker-end="url(#a-ink)"/>
  <text class="sans t" x="510" y="388" font-size="12.5" text-anchor="middle">收到一条 handle 指令</text>
  <text class="mono t3" x="510" y="440" font-size="10.5" text-anchor="middle">dormmate/v1/cmd　不 retained</text>
  <text class="sans t3" x="510" y="456" font-size="10.5" text-anchor="middle">来源：看板按钮 / 手机 / 语音 / 剧本</text>

  <!-- HANDLING 自环 -->
  <path class="ln" d="M 725 350 C 725 294, 815 294, 833 350" marker-end="url(#a-ink)"/>
  <text class="sans t3" x="781" y="272" font-size="11" text-anchor="middle">再点一次只是多记一笔动作</text>
  <text class="sans t3" x="781" y="288" font-size="11" text-anchor="middle">验证窗口一次都不重置</text>

  <!-- HANDLING -->
  <rect x="655" y="350" width="230" height="120" rx="12" fill="#fbe9f1" stroke="#c9407f" stroke-width="2"/>
  <text class="mono t" x="770" y="384" font-size="19" font-weight="700" text-anchor="middle">HANDLING</text>
  <text class="sans t2" x="770" y="408" font-size="14" text-anchor="middle">处理中</text>
  <line x1="673" y1="421" x2="867" y2="421" stroke="#f3cede" stroke-width="1"/>
  <text class="sans t3" x="770" y="443" font-size="10.5" text-anchor="middle">这里对 event.state 的赋值</text>
  <text class="sans t3" x="770" y="459" font-size="10.5" text-anchor="middle">全项目只有一处：= HANDLING</text>

  <!-- 「由后来的数据判定」那一栏 -->
  <rect x="1178" y="228" width="248" height="414" rx="12"
        fill="none" stroke="#d03b3b" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="sans red" x="1302" y="218" font-size="11.5" font-weight="700" text-anchor="middle">
    这一栏里的两个状态，只能由数据判
  </text>

  <!-- HANDLING → RECOVERED -->
  <path class="ln" d="M 885 410 C 1010 410, 1050 306, 1196 306" marker-end="url(#a-ink)"/>
  <text class="sans good" x="1168" y="288" font-size="12" font-weight="700" text-anchor="end">
    后面连着 N 条正常
  </text>

  <!-- RECOVERED -->
  <rect x="1200" y="246" width="210" height="120" rx="12" fill="#f1faf1" stroke="#0ca30c" stroke-width="2"/>
  <text class="mono good" x="1305" y="280" font-size="17" font-weight="700" text-anchor="middle">RECOVERED</text>
  <text class="sans t2" x="1305" y="304" font-size="14" text-anchor="middle">已恢复</text>
  <line x1="1218" y1="317" x2="1392" y2="317" stroke="#cdeccd" stroke-width="1"/>
  <text class="sans t3" x="1305" y="338" font-size="10" text-anchor="middle">recovered_at 填上，写的是</text>
  <text class="sans t3" x="1305" y="354" font-size="10" text-anchor="middle">最后那条正常数据的时刻</text>

  <!-- HANDLING → UNRESOLVED -->
  <path class="ln" d="M 885 410 C 1010 410, 1050 560, 1196 560" marker-end="url(#a-ink)"/>
  <text class="sans sero" x="1168" y="578" font-size="12" font-weight="700" text-anchor="end">
    后面连着 N 条还是异常
  </text>

  <!-- UNRESOLVED -->
  <rect x="1200" y="500" width="210" height="120" rx="12" fill="#fdf4ef" stroke="#ec835a" stroke-width="2"/>
  <text class="mono sero" x="1305" y="534" font-size="17" font-weight="700" text-anchor="middle">UNRESOLVED</text>
  <text class="sans t2" x="1305" y="558" font-size="14" text-anchor="middle">未恢复</text>
  <line x1="1218" y1="571" x2="1392" y2="571" stroke="#f6d9cb" stroke-width="1"/>
  <text class="sans t3" x="1305" y="592" font-size="10" text-anchor="middle">recovered_at 保持 null</text>
  <text class="sans t3" x="1305" y="608" font-size="10" text-anchor="middle">不是空串（看板判的就是 null）</text>

  <!-- ============================ 底部说明 ============================ -->
  <text class="sans t2" x="32" y="690" font-size="12.5">
    门槛不在这儿定：连续几条算恢复、连续几条算没治好，都在 core/config.json 的 events 块里，事件层不自己定数
  </text>
  <text class="sans t2" x="32" y="716" font-size="12.5">
    连点很多次 handle 只多记几笔动作，验证窗口一次都不重置 —— 重置的话连点几下就能把判据一直往后推，事件永远判不出未恢复
  </text>
  <text class="sans t2" x="32" y="742" font-size="12.5">
    core 重启时读到还没结案的事件，一律按 UNRESOLVED 收尾并在 result 里写明是重启造成的 —— 不然它会永远挂在「处理中」
  </text>

  <line x1="32" y1="762" x2="1408" y2="762" stroke="#e1e0d9" stroke-width="1"/>
  <text class="sans t3" x="32" y="784" font-size="11.5">
    D3 剧本 14 帧（3 偏热 → handle → 3 正常 → 3 偏湿 → handle → 3 偏湿）：
    dorm-b 那一幕回收成 RECOVERED，dorm-c 那一幕收成 UNRESOLVED。
  </text>

</svg>
