<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DormMate 演示视频 · 分镜预演与提词器</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --panel2: #23272f;
    --ink: #e8eaed; --dim: #9aa3af; --line: #31363f;
    --hot: #e8834a; --calm: #4a9ee8; --ok: #4ec98a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.7 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: baseline; gap: 16px;
    padding: 12px 22px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex: none;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .warn {
    font-size: 12px; color: var(--dim);
  }
  header .warn b { color: var(--hot); }
  .clock { margin-left: auto; display: flex; align-items: baseline; gap: 10px; }
  .clock .now { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .clock .rest { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }

  .bar { height: 4px; background: var(--panel2); display: flex; flex: none; }
  .bar i { display: block; height: 100%; background: var(--line); border-right: 1px solid var(--bg); }
  .bar i.done { background: var(--ok); }
  .bar i.live { background: var(--hot); }

  main { display: flex; flex: 1; min-height: 0; }

  nav {
    width: 268px; flex: none; background: var(--panel);
    border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 0;
  }
  nav button {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; border-left: 3px solid transparent;
    color: var(--dim); font: inherit; font-size: 13px; line-height: 1.45;
    padding: 8px 14px; display: flex; gap: 9px; align-items: flex-start;
  }
  nav button:hover { background: var(--panel2); color: var(--ink); }
  nav button.on { border-left-color: var(--hot); background: var(--panel2); color: var(--ink); }
  nav button .idx {
    flex: none; width: 20px; text-align: right; font-variant-numeric: tabular-nums;
    color: var(--dim); font-size: 12px; padding-top: 1px;
  }
  nav button.on .idx { color: var(--hot); }
  nav button .t { flex: 1; }
  nav button .d { flex: none; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }

  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .stage { flex: 1; overflow-y: auto; padding: 22px 30px 8px; }
  .seg-title { font-size: 15px; color: var(--dim); margin: 0 0 4px; }
  .seg-title b { color: var(--hot); }
  .speak { margin: 0 0 20px; }
  .speak p {
    font-size: 25px; line-height: 1.62; margin: 0 0 14px; letter-spacing: .01em;
  }
  .cue {
    display: inline-block; margin: 0 0 6px;
    background: rgba(232,131,74,.14); color: var(--hot);
    border: 1px solid rgba(232,131,74,.35); border-radius: 999px;
    padding: 1px 11px; font-size: 13px; font-weight: 600;
  }
  .cue + p, .cue + div { margin-top: 2px; }
  .cue-note { font-size: 17px; color: var(--dim); margin: 0 0 16px; }
  .cue-note code { color: #cfd6e0; }

  aside {
    flex: none; border-top: 1px solid var(--line); background: var(--panel);
    padding: 12px 30px 16px; max-height: 34vh; overflow-y: auto;
  }
  aside h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--dim); margin: 0 0 7px; font-weight: 600;
  }
  aside .screen { font-size: 16px; margin: 0 0 12px; }
  aside .screen code { color: #cfd6e0; background: var(--panel2); padding: 1px 5px; border-radius: 3px; }
  aside .cmd {
    font-family: Consolas, "Cascadia Mono", monospace; font-size: 14px;
    background: var(--panel2); border-left: 3px solid var(--calm);
    padding: 8px 12px; border-radius: 0 4px 4px 0; margin: 0 0 8px;
    white-space: pre-wrap; word-break: break-all;
  }
  aside .act { font-size: 15px; color: var(--dim); margin: 0 0 6px; }
  aside .act b { color: var(--ok); }

  footer {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 10px 30px; border-top: 1px solid var(--line); background: var(--panel);
  }
  footer button {
    font: inherit; font-size: 14px; cursor: pointer;
    background: var(--panel2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 16px;
  }
  footer button:hover { border-color: var(--dim); }
  footer button.go { background: var(--hot); border-color: var(--hot); color: #14161a; font-weight: 700; }
  footer kbd {
    font: inherit; font-size: 12px; background: var(--panel2);
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; color: var(--dim);
  }
  footer .hint { margin-left: auto; color: var(--dim); font-size: 12px; }
  footer label { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 6px; }

  .empty { color: var(--dim); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>DormMate 演示视频 · 分镜预演与提词器</h1>
  <span class="warn">这是<b>提词器</b>，不是视频 —— 画面得你自己录</span>
  <span class="clock"><span class="now" id="now">0:00</span><span class="rest" id="rest">/ 7:00</span></span>
</header>
<div class="bar" id="bar"></div>

<main>
  <nav id="nav"></nav>
  <section>
    <div class="stage" id="stage"></div>
    <aside>
      <h2>屏幕画面</h2>
      <div class="screen" id="screen"></div>
      <h2 style="margin-top:10px">这一段要做的</h2>
      <div id="acts"></div>
    </aside>
    <footer>
      <button id="play" class="go">开始</button>
      <button id="prev">上一段</button>
      <button id="next">下一段</button>
      <label><input type="checkbox" id="loop"> 到点自动停</label>
      <span class="hint"><kbd>空格</kbd> 开始/暂停　<kbd>←</kbd><kbd>→</kbd> 换段　<kbd>R</kbd> 归零</span>
    </footer>
  </section>
</main>

<script>
const SEGMENTS = [{"n": 1, "title": "开场：这是个什么系统", "start": 0, "end": 40, "dur": 40, "screen": "`dashboard/` 全屏。三种状态各占一张卡（先别跑剧本，就用当前画面）。", "notes": [["动作", "鼠标在\"当前重点\"那一行上停一下，再划到下面三张卡。"]], "lines": ["这是 DormMate，一个多节点宿舍环境助手。", "三间宿舍，每间一个温湿度节点。数据走 MQTT 上来，经过中间一个 core 算出结论，", "再推给看板、手机和 3D 三个界面。", "整个系统只有四个进程和一个消息代理 —— 没有服务器程序，也没有数据库。", "它要回答的其实只有一个问题：<strong>现在该先管哪一间；管完之后，到底好没好。</strong>"]}, {"n": 2, "title": "D1：一条消息，三个界面同时动", "start": 40, "end": 90, "dur": 50, "screen": "分屏：左边终端，右边 dashboard；第二屏再带出 mobile 和 3D。", "notes": [["动作", "在终端里跑："], ["跑", "py -3.14 -m simulator.simulator --script simulator/scenarios/phase1_demo.json"]], "lines": ["我发一条消息出去。", "dorm-a，二十五度、湿度六十 —— 正常。", "dorm-b，三十一度、湿度七十八 —— 偏热。", "dorm-c，十六度 —— 偏冷。", "留意 dorm-b 这一条。它的湿度七十<strong>八</strong>，也过了七十五那条线，但状态给的是", "<strong>偏热</strong>，不是偏湿。因为判定是<strong>有顺序</strong>的：先看温度低于十八算偏冷，", "再看温度到了三十算偏热，最后才轮到湿度。顺序一换，这一条就变成偏湿了 ——", "所以这个顺序不能动。", "再看这个。【切到三个界面】一条消息发出去，手机端和 3D 页面同时跟着变了。", "它们没有各算一遍。三个界面订阅的是<strong>同一条</strong> core 发出来的快照 ——", "谁该是什么状态，是 core 算好的。"]}, {"n": 3, "title": "D2：系统自己指出先看哪一间", "start": 90, "end": 140, "dur": 50, "screen": "dashboard 顶部「当前重点」；切到 3D，那一间房上有脉冲光环。", "notes": [["动作", "停掉模拟器，跑："], ["跑", "py -3.14 -m simulator.simulator --script simulator/scenarios/d2_case1.json"]], "lines": ["现在 dorm-b 和 dorm-c 同时出问题了。系统自己挑了一间，还给了一句话：", "「已连续偏热…分钟，异常次数最多」。", "这句话不是套模板写死的。它是<strong>真的比出来的</strong> —— 比四步：先比谁这一段异常", "持续得久；一样久，就比这段里攒了多少条；条数还一样，就比哪个状态更要紧；", "全平了，才按名字排。赢在哪一步，它就说哪一步 —— 赢在时长的那条不会去提异常次数。", "还有一点要注意。【指到 20:07 那一段】这会儿 dorm-b 的读数<strong>已经回到正常</strong>了，", "可是\"当前重点\"还是它。", "这不是页面没刷新 —— 是<strong>那一段还没结束</strong>。要<strong>连着三条</strong>正常读数，", "这一段才算真的过去。数据说结束，才算结束。"]}, {"n": 4, "title": "E2：用说的", "start": 140, "end": 200, "dur": 60, "screen": "切到 `web/` 页面（M1 那版单节点页 —— 语音落在这个页面上）。允许麦克风。", "notes": [], "lines": ["有时候手上有事，碰不了键盘。", "【点「语音指令」，说】「查看 dorm-c」—— 手机端和 3D 一起切到了 dorm-c。", "这里有个细节值得说：页面回我的话是\"<strong>已发出</strong>\"，不是\"焦点已经切过去了\"。", "因为它只知道消息交给了 broker —— core 收没收到、认不认这条指令，", "要等<strong>下一帧快照</strong>回来才算数。它不替 core 宣布结果。", "【说】「朗读」—— 它把这间现在的情况念出来。念的是完整的一句话，", "不是照着表格一行一行读。", "【说】「记录现场」—— 拍一张。", "【指照片水印那行】照片上这行字是：<strong>宿舍名、事件编号、时间</strong>。", "它挂到 dorm-c 此刻<strong>未结案</strong>的那条事件上，不是随便存一张图进文件夹。", "要是这会儿没有未结案的事件，页面会直说，core 那边也会拒收 ——", "它<strong>不会编一个编号出来</strong>。事后有人拿一个假编号去案卷里查，查不到才最坏。"]}, {"n": 5, "title": "D3 / E1 / E3：处理、同步、数据自己判恢复", "start": 200, "end": 280, "dur": 80, "screen": "三块并排：手机端 / dashboard / 3D。这一段是全场重点，画面要给足。", "notes": [["动作", "停掉上一个模拟器，跑："], ["跑", "py -3.14 -m simulator.simulator --script simulator/scenarios/d3_event.json"]], "lines": ["dorm-b 偏热。值班的人在手机上按一下「开始处理」。", "【按下去】三块界面同时变了：手机上的按钮翻成处理中；看板事件表那一条", "从\"待处理\"变成\"处理中\"；3D 里 dorm-b 这间房的顶上，挂出一个小小的\"处理中\"。", "<strong>但是——事件本身没有变成\"已恢复\"。</strong>", "按一下按钮，只够把它推到\"处理中\"。这是这个项目的一条硬规矩。", "不是靠我记得别这么写 —— 是<strong>代码结构上就做不到</strong>：处理指令那个函数的函数体里，", "一次都没有出现过节点状态。它拿不到，也就改不了。", "接下来才是关键。【等剧本继续跑】我继续发数据：二十九度、二十七度、二十五度 ——", "连着三条正常。", "第三条进来的那一刻，事件<strong>自己</strong>翻成了「已恢复」。恢复时间取的是", "<strong>这条报文里写的那个时间</strong>，不是我按按钮的时间。", "【指 3D】这间房也变了：地板从红色回到灰色，风扇停下来。", "【切到报告】这份复盘在报告里 —— 注意，不是 report.html 那一份，", "是 <strong>history-report.html</strong>。事件时间线上写得很清楚：什么时候开案、谁处理的、", "处理之后收到了几条、什么时候结的案。", "剧本的第二幕是<strong>对照</strong>：dorm-c 处理之后数据还是偏湿，连着三条异常 ——", "事件最后判的是「未恢复」。没有这一幕，\"按了就能好\"和\"数据说的才算\"，", "在截图上根本分不出来。"]}, {"n": 6, "title": "D4：把 Broker 停掉", "start": 280, "end": 350, "dur": 70, "screen": "终端为主，右侧 dashboard 一直可见。别切走。", "notes": [["动作", "到 Broker 那个终端按 Ctrl+C。"]], "lines": ["现在演示一次故障。我把 Broker 停掉。", "【指三个页面】三个页面右上角立刻变成\"未连接、重连中\"。", "core 那边打了一行\"与 broker 断开\"—— 然后，<strong>就再也没有任何反应了</strong>。", "【重启 Broker】我把 Broker 起回来。", "页面自己回到\"已连接\"了。", "<strong>但是数字不动了。</strong> 看板上的温湿度还是刚才那一帧。", "这里最容易被骗：页面说已连接，看着一切正常，可数据是<strong>冻住</strong>的。", "【指页面顶部那条 core 心跳】怎么定位？看这一条 —— 它已经十几秒没更新了。", "说明 core 没回来。", "为什么？四个进程里<strong>只有 core 不会自己重连</strong>。三个页面用的是 mqtt.js", "自带的重连，模拟器走的是 loop_forever —— 那个函数里带自动重连。", "core 用的是轮询式的 loop，而 paho 的自动重连<strong>只在 loop_forever 里面</strong>。", "所以它断了就是断了。", "【重启 core】把 core 重启一遍 —— 数据立刻就跟上来了。", "这次演示里，\"手动修复\"不是一个偷懒的省略，它<strong>就是修复动作本身</strong>。", "接自动重连大概只要六行，我把它写在文档的拓展里了。"]}, {"n": 7, "title": "D5：规则说正常，模型说不像", "start": 350, "end": 390, "dur": 40, "screen": "浏览器打开 `report/history-report.html`，滚到「Rule-ML 对比」和", "notes": [], "lines": ["这份报告里有一块对照。", "固定规则回答的是\"<strong>越没越线</strong>\"—— 三条提前写好的线：温度低于十八、温度到三十、", "湿度到七十五。", "模型回答的是另一个问题：\"<strong>这条读数像不像这间宿舍平时那些</strong>\"。", "这两个问题本来就不必给出同一个答案，不一致也不说明谁错了。", "这一份数据里，有判词的八十多行，<strong>三十二行</strong>两边不一样。", "我把<strong>两个方向</strong>都列出来了：规则说正常、模型说不像的，八行；", "反过来，规则说异常、模型说像的，二十四行。", "只留一个方向的话，另一个方向在表里看着和\"两边都同意\"长得一模一样。", "【指最后一列】看这一列 —— 这间宿舍历史上温湿度的范围。", "比如这一条，dorm-b，二十三度、湿度三十二 —— 规则判正常；", "可 dorm-b 平时湿度从来没到过这么低的位置，所以模型说不像。", "对着这一列看，<strong>为什么不一样就有答案了</strong>，不用猜。", "⚠ <strong>拍摄提示</strong>：这一段的数字（八十多行 / 三十二行 / 八行 / 二十四行）是", "<strong>从当前那份 <code>data/history.csv</code> 现算出来的</strong>。你录制前要是又灌过数据，", "重新生成一遍报告，然后<strong>照着屏幕上真实的数字念</strong>，别照着这本脚本念。", "报告里每个数都是算出来的，脚本里这几个数只是\"此刻长什么样\"的快照。"]}, {"n": 8, "title": "收尾：亮点与局限", "start": 390, "end": 420, "dur": 30, "screen": "回到 dashboard 全景，鼠标慢慢划过三张卡。", "notes": [], "lines": ["最后说三件事。", "第一，这个系统里<strong>判断只有一处</strong>。三个界面一条阈值都不认识，", "它们只把 core 算好的结论画出来。这条有测试盯着 —— 前端那个文件里", "一旦出现十八、三十、七十五这三个数，测试就红。", "第二，<strong>恢复不由按钮决定</strong>。按钮说\"我处理了\"，数据说\"它好了\"，", "这是两句话，得由后一句话说了算。", "第三，局限我也写在文档里，不藏着：core 断了不会自己重连；", "core 也不做数值范围校验 —— 九十九度它照收。它管的是", "\"这是不是我们要的那种数据\"，不管这个数在物理上合不合理。", "七分钟到这儿。谢谢。"]}];
const PREP = ["### 要起来的进程", "1. start_broker.bat                                  # Mosquitto：TCP 1883 + WebSocket 9001", "2. py -3.14 core.py                                  # 终端 1 —— 整段录制期间不要关", "3. start_web.bat                                     # 静态服务器 8000，顺便打开 web/ 页", "浏览器开四个标签，都留在那儿随时切：", "http://localhost:8000/dashboard/     看板（三张卡 + 当前重点 + 事件表）", "http://localhost:8000/three/         3D（三间房并排）", "http://localhost:8000/mobile/        移动端（谁该管 / 点一下看他 / 开始处理）", "http://localhost:8000/web/           M1 那版单节点页 —— 第 4 段的语音在这个页面上", "### 三个必须避开的坑", "### 浏览器两点", "- 用 <strong>Chrome 或 Edge</strong>，别用 Firefox —— 它没有语音识别接口。", "- <strong>第 4 段必须在电脑前、在 <code>http://localhost:8000/</code> 上拍</strong>，不能在手机上用", "<code>http://&lt;IP&gt;:8000/</code>。麦克风和摄像头要求<strong>安全上下文</strong>，走 IP 打开时", "<code>navigator.mediaDevices</code> 直接是 <code>undefined</code>，语音直接就废了。", "（手机端本身有它自己的戏份，在第 5 段。）", "---"];
const TOTAL = 420;

const el = {
  nav: document.getElementById('nav'),
  stage: document.getElementById('stage'),
  screen: document.getElementById('screen'),
  acts: document.getElementById('acts'),
  now: document.getElementById('now'),
  rest: document.getElementById('rest'),
  bar: document.getElementById('bar'),
  play: document.getElementById('play'),
  prev: document.getElementById('prev'),
  next: document.getElementById('next'),
  loop: document.getElementById('loop'),
};

function mmss(s) {
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

let idx = 0, elapsed = 0, playing = false, raf = 0, last = 0;

function segAt(t) {
  for (let i = 0; i < SEGMENTS.length; i++) {
    if (t < SEGMENTS[i].end) return i;
  }
  return SEGMENTS.length - 1;
}

function renderNav() {
  el.nav.innerHTML = '';
  const mk = (label, sub, i, dur) => {
    const b = document.createElement('button');
    b.innerHTML = '<span class="idx">' + label + '</span>'
      + '<span class="t">' + sub + '</span>'
      + '<span class="d">' + dur + '</span>';
    b.addEventListener('click', () => { idx = i; elapsed = segStart(i); draw(); });
    el.nav.appendChild(b);
    return b;
  };
  el.nav.appendChild(mk('·', '开拍前：起进程与三个坑', -1, ''));
  SEGMENTS.forEach((s, i) => mk(String(s.n), s.title, i, mmss(s.dur)));
}

function segStart(i) { return i < 0 ? 0 : SEGMENTS[i].start; }

function renderBar() {
  el.bar.innerHTML = '';
  SEGMENTS.forEach(s => {
    const i = document.createElement('i');
    i.style.flex = String(s.dur);
    el.bar.appendChild(i);
  });
}

function paintBar() {
  const live = segAt(elapsed);
  [...el.bar.children].forEach((n, i) => {
    n.className = i < live ? 'done' : (i === live ? 'live' : '');
  });
}

function renderStage() {
  if (idx < 0) {
    el.stage.innerHTML = '<p class="seg-title"><b>开拍前</b>（不录）</p>'
      + '<div class="speak">' + PREP.map(p => '<p>' + p + '</p>').join('') + '</div>';
    el.screen.innerHTML = '四个标签页：dashboard / three / mobile / web，都留在那儿随时切。';
    el.acts.innerHTML = '';
    return;
  }
  const s = SEGMENTS[idx];
  const when = mmss(s.start) + ' – ' + mmss(s.end) + '（' + s.dur + ' 秒）';
  let h = '<p class="seg-title"><b>第 ' + s.n + ' 段</b> · ' + s.title
    + '　<span style="opacity:.6">' + when + '</span></p>';
  h += '<div class="speak">';
  s.lines.forEach(line => {
    const m = line.match(/^【(.+?)】(.*)$/);
    if (m) {
      h += '<div class="cue">' + m[1] + '</div>';
      if (m[2].trim()) h += '<p>' + m[2].trim() + '</p>';
    } else {
      h += '<p>' + line + '</p>';
    }
  });
  h += '</div>';
  el.stage.innerHTML = h;

  el.screen.innerHTML = s.screen || '——';

  let a = '';
  // 按原文顺序摆：有的段先是【动作】"停掉上一个模拟器，跑："、后面才跟命令块。
  // 把命令全提到前面去的话，那句说明就跑到命令下面了，读着像倒装。
  s.notes.forEach(n => {
    a += n[0] === '跑'
      ? '<div class="cmd">' + n[1] + '</div>'
      : '<p class="act"><b>【' + n[0] + '】</b>' + n[1] + '</p>';
  });
  el.acts.innerHTML = a || '<p class="act" style="opacity:.6">这一段不用跑命令。</p>';
  el.stage.scrollTop = 0;
}

function draw() {
  const live = playing ? segAt(elapsed) : idx;
  idx = live < 0 ? -1 : live;
  renderStage();
  el.now.textContent = mmss(elapsed);
  el.rest.textContent = '/ ' + mmss(TOTAL);
  paintBar();
  [...el.nav.children].forEach((n, i) => {
    n.classList.toggle('on', i - 1 === idx);
  });
  el.play.textContent = playing ? '暂停' : (elapsed === 0 ? '开始' : '继续');
  el.play.classList.toggle('go', !playing);
}

function tick(ts) {
  if (!playing) return;
  if (!last) last = ts;
  elapsed += (ts - last) / 1000;
  last = ts;
  if (elapsed >= TOTAL) {
    elapsed = TOTAL;
    playing = false;
    last = 0;
    draw();
    return;
  }
  draw();
  raf = requestAnimationFrame(tick);
}

function play() {
  if (elapsed >= TOTAL) elapsed = 0;
  playing = true; last = 0;
  raf = requestAnimationFrame(tick);
  draw();
}
function pause() {
  playing = false; last = 0;
  cancelAnimationFrame(raf);
  draw();
}
function goto(i) {
  idx = Math.max(-1, Math.min(SEGMENTS.length - 1, i));
  const s = idx < 0 ? 0 : SEGMENTS[idx].start;
  elapsed = playing ? elapsed : s;
  if (playing) { elapsed = Math.max(elapsed, s); }
  draw();
}

el.play.addEventListener('click', () => playing ? pause() : play());
el.next.addEventListener('click', () => goto(idx + 1));
el.prev.addEventListener('click', () => goto(idx - 1));
el.loop.addEventListener('change', () => {});

document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); goto(idx + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goto(idx - 1); }
  else if (e.key === 'r' || e.key === 'R') {
    playing = false; cancelAnimationFrame(raf);
    last = 0; elapsed = 0; idx = 0; draw();
  }
});

renderNav();
renderBar();
draw();
</script>
</body>
</html>
